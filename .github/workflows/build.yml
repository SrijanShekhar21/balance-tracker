name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Gradle is provided by the action, so the repository does not need to carry the
      # binary gradle-wrapper.jar that a normal Android Studio project would.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Restored from a repository secret so every build is signed with the same key.
      # Without this the APK cannot upgrade an existing install.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > release.p12

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f release.p12

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/BalanceTracker.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/BalanceTracker-debug.apk

      # Publishing to a fixed tag keeps one permanent download URL that always serves the
      # newest build, so the link never has to change.
      - name: Publish to the rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/BalanceTracker.apk out/BalanceTracker-debug.apk             --title "Latest build (v3.0.${{ github.run_number }})"             --notes "Automatically published from the newest commit on main."             --latest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BalanceTracker-apk
          path: out/*.apk
          retention-days: 90
