name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Gradle is provided by the action, so the repository does not need to carry the
      # binary gradle-wrapper.jar that a normal Android Studio project would.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/BalanceTracker-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/BalanceTracker-debug-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BalanceTracker-apk
          path: out/*.apk
          retention-days: 90
